<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tech Portfolio | Experiments</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            border-bottom: 3px solid #764ba2;
            padding-bottom: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 80px;
        }

        button:hover {
            background: var(--primary-gradient);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: transparent;
        }

        /* Highlighting the Main Project */
        .project-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            font-weight: 700;
        }

        .project-btn:hover {
            background: #ffffff;
            color: #000;
        }

        /* Footer feel */
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head> 
<body>

        <a href="experiment03/experiment3.html" class="card"><button>Experiment 3: Layouts</button></a>
        <a href="experiment04/experiment4.html" class="card"><button>Experiment 4: JS Basics</button></a>
        <a href="experiment05/experiment5simplecalculator.html" class="card"><button>Experiment 5: Simple Calculator</button></a>
        <a href="experiment06/experiment6.html" class="card"><button>Experiment 6: DOM Tasks</button></a>
        <a href="experiment07/experiment7.html" class="card"><button>Experiment 7: Movie Dashboard</button></a>
        <a href="experiment08/index.html" class="card"><button>Experiment 8: PHP Learning</button></a>
        <a href="experiment09/experiment9.html" class="card"><button>Experiment 9: DB Registration</button></a>
        <a href="https://calciiii.great-site.net" class="card"><button>Experiment 10: Scientific Calculator</button></a>
        
        <a href="https://projectbyankita.infinityfree.me/" class="card"><button class="project-btn">🚀 Main Project: Ankita's Sweet Delight</button></a>
        <a href="https://github.com/khushisingh892210-create/webtechnlogy-project" class="card"><button>📂 Source Code: Main Project</button></a>

        © 2026 | Developed for Web Technology Lab
    </div>
