<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form with Database</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 450px;
            max-width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .input-box input,
        .input-box select,
        .input-box textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-box input:focus,
        .input-box select:focus,
        .input-box textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .gender-box {
            margin-bottom: 15px;
        }

        .gender-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        .gender-options {
            margin-top: 5px;
        }

        .gender-options label {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
        }

        .gender-options input {
            margin-right: 5px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        @media (max-width: 500px) {
            .container {
                width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form (Save to Database)</h2>
    <div id="successMsg" class="success-message"></div>
    <div id="errorMsg" class="error-message"></div>

    <form method="POST" action="save_data.php" enctype="multipart/form-data">
        <div class="input-box">
            <label for="fullname">Full Name <span style="color: red;">*</span></label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="input-box">
            <label for="email">Email <span style="color: red;">*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label for="phone">Phone Number <span style="color: red;">*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
        </div>

        <div class="input-box">
            <label for="password">Password <span style="color: red;">*</span></label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="input-box">
            <label for="dob">Date of Birth <span style="color: red;">*</span></label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div class="gender-box">
            <label>Gender <span style="color: red;">*</span></label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
        </div>

        <div class="input-box">
            <label for="course">Course <span style="color: red;">*</span></label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option>Web Development</option>
                <option>Data Science</option>
                <option>Graphic Design</option>
                <option>Digital Marketing</option>
            </select>
        </div>

        <div class="input-box">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
        </div>

        <div class="input-box">
            <label for="profilepic">Upload Profile Picture</label>
            <input type="file" id="profilepic" name="profilepic" accept="image/*">
        </div>

        <button type="submit" class="btn">Register</button>
    </form>
</div>

</body>
</html>
